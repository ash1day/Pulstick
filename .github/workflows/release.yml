name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app bundle
        run: UNIVERSAL=1 ./build.sh
      # Finder でのコピーと同じく、拡張属性やリソースを保ったまま zip にする
      - name: Package
        run: ditto -c -k --keepParent build/Pulstick.app Pulstick.zip
      # 書き込み権限を渡すので、サードパーティのアクションではなく公式の gh CLI を使う
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" Pulstick.zip --generate-notes
